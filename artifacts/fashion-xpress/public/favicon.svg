<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="50" y1="50" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCE5B5" />
      <stop offset="35%" stop-color="#D4AF37" />
      <stop offset="70%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#EDC967" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#554215" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="url(#borderGrad)" stroke-width="6" />

  <!-- Inner Gold Framing -->
  <rect x="28" y="28" width="456" height="456" rx="84" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35" stroke-dasharray="8 8"/>

  <!-- TFX Monogram Typography -->
  <g filter="url(#goldGlow)">
    <text x="256" y="285" 
          font-family="'Playfair Display', 'Cinzel', 'Didot', 'Georgia', serif" 
          font-size="160" 
          font-weight="900" 
          letter-spacing="6"
          fill="url(#goldGrad)" 
          text-anchor="middle">
      TFX
    </text>
  </g>

  <!-- Subtitle: THE FASHION XPRESS -->
  <text x="256" y="348" 
        font-family="'Montserrat', 'Inter', sans-serif" 
        font-size="24" 
        font-weight="700" 
        letter-spacing="12" 
        fill="#D4AF37" 
        text-anchor="middle"
        opacity="0.95">
    THE FASHION XPRESS
  </text>

  <!-- Luxury Diamond Sparkle Top Right -->
  <path d="M390 125 L398 100 L406 125 L431 133 L406 141 L398 166 L390 141 L365 133 Z" fill="url(#goldGrad)" />
  <!-- Luxury Diamond Sparkle Bottom Left -->
  <path d="M105 385 L110 368 L115 385 L132 390 L115 395 L110 412 L105 395 L88 390 Z" fill="url(#goldGrad)" opacity="0.8" />
</svg>
