kind = "web"
previewPath = "/"
title = "Fashion Xpress"
version = "1.0.0"
id = "artifacts/fashion-xpress"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20217

[services.development]
run = "pnpm --filter @workspace/fashion-xpress run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fashion-xpress", "run", "build" ]
serve = "static"
publicDir = "artifacts/fashion-xpress/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20217"
BASE_PATH = "/"
