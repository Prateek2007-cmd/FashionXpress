<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>The Fashion Xpress — Premium Home Fashion Visits</title>
    <meta name="description" content="The Fashion Xpress brings designer fashion to your doorstep. Book a personal home visit with our Fashion Executive and try premium outfits before you buy." />
    <meta name="keywords" content="fashion home visit, try before you buy, personal stylist, designer outfits, home fashion delivery, The Fashion Xpress" />
    <meta name="author" content="The Fashion Xpress" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.thefashionxpress.com" />

    <!-- Open Graph (Facebook / WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thefashionxpress.com" />
    <meta property="og:site_name" content="The Fashion Xpress" />
    <meta property="og:title" content="The Fashion Xpress — Premium Home Fashion Visits" />
    <meta property="og:description" content="Book a personal home fashion visit. Our Fashion Executive brings designer outfits directly to your door — try them, buy what you love." />
    <meta property="og:image" content="https://www.thefashionxpress.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.thefashionxpress.com" />
    <meta name="twitter:title" content="The Fashion Xpress — Premium Home Fashion Visits" />
    <meta name="twitter:description" content="Book a personal home fashion visit. Our Fashion Executive brings designer outfits directly to your door." />
    <meta name="twitter:image" content="https://www.thefashionxpress.com/og-image.jpg" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload LCP image immediately -->
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />

    <!-- Preload logo -->
    <link rel="preload" as="image" href="/logo.jpg" />

    <!-- Non-render-blocking Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
