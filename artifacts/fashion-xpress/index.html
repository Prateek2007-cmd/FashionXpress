<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>The Fashion Xpress (TFX) — Premium Home Fashion Visits</title>
    <meta name="description" content="The Fashion Xpress (TFX) brings designer fashion to your doorstep. Book a personal home visit with our Fashion Executive and try premium outfits before you buy." />
    <meta name="keywords" content="TFX, TFX fashion, The Fashion Xpress, TFX home visit, tfx online, tfx clothes, fashion home visit, try before you buy, personal stylist, designer outfits, home fashion delivery, The Fashion Xpress TFX" />
    <meta name="author" content="The Fashion Xpress (TFX)" />
    <meta name="robots" content="index, follow" />

    <!-- Schema.org Organization & Brand Structured Data for Google -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "The Fashion Xpress",
      "alternateName": ["TFX", "TFX Fashion", "The Fashion Xpress (TFX)", "TheFashionXpress"],
      "url": "https://www.thefashionxpress.com",
      "logo": "https://www.thefashionxpress.com/logo.jpg",
      "description": "The Fashion Xpress (TFX) brings designer fashion directly to your doorstep with personal home visits.",
      "sameAs": [
        "https://www.instagram.com",
        "https://www.facebook.com",
        "https://www.twitter.com"
      ]
    }
    </script>

    <!-- Canonical -->
    <link rel="canonical" href="https://www.thefashionxpress.com" />

    <!-- Open Graph (Facebook / WhatsApp previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.thefashionxpress.com" />
    <meta property="og:site_name" content="The Fashion Xpress (TFX)" />
    <meta property="og:title" content="The Fashion Xpress (TFX) — Premium Home Fashion Visits" />
    <meta property="og:description" content="Book a personal home fashion visit with The Fashion Xpress (TFX). Our Fashion Executive brings designer outfits directly to your door — try them, buy what you love." />
    <meta property="og:image" content="https://www.thefashionxpress.com/og-image.jpg" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.thefashionxpress.com" />
    <meta name="twitter:title" content="The Fashion Xpress (TFX) — Premium Home Fashion Visits" />
    <meta name="twitter:description" content="Book a personal home fashion visit with The Fashion Xpress (TFX). Our Fashion Executive brings designer outfits directly to your door." />
    <meta name="twitter:image" content="https://www.thefashionxpress.com/og-image.jpg" />

    <!-- Theme -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Preload LCP image immediately -->
    <link rel="preload" as="image" href="/hero.jpg" fetchpriority="high" />

    <!-- Preload logo -->
    <link rel="preload" as="image" href="/logo.jpg" />

    <!-- Self-hosted Inter fonts — no external dependency -->
    <link rel="preload" href="/fonts/Inter-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-500.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-600.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Inter-700.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
