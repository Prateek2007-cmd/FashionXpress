openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Fashion Xpress API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: customers
  - name: catalog
  - name: wishlist
  - name: cart
  - name: bookings
  - name: executives
  - name: invoices
  - name: admin
  - name: notifications
  - name: reviews
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ---------------- AUTH ----------------
  /auth/register:
    post:
      operationId: registerCustomer
      tags: [auth]
      summary: Register a new customer account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "400":
          description: Invalid input
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login as customer, admin, or executive
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Invalid credentials
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  # ---------------- CUSTOMER PROFILE ----------------
  /customers/me:
    get:
      operationId: getMyCustomerProfile
      tags: [customers]
      responses:
        "200":
          description: Customer profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
    patch:
      operationId: updateMyCustomerProfile
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"
  /customers/me/addresses:
    get:
      operationId: listMyAddresses
      tags: [customers]
      responses:
        "200":
          description: Addresses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Address"
    post:
      operationId: createMyAddress
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
  /customers/me/addresses/{id}:
    patch:
      operationId: updateMyAddress
      tags: [customers]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddressInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Address"
        "404":
          description: Not found
    delete:
      operationId: deleteMyAddress
      tags: [customers]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /customers/me/measurements:
    get:
      operationId: getMyMeasurements
      tags: [customers]
      responses:
        "200":
          description: Measurements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"
        "404":
          description: Not set yet
    put:
      operationId: setMyMeasurements
      tags: [customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MeasurementInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Measurement"

  # ---------------- CATALOG ----------------
  /categories:
    get:
      operationId: listCategories
      tags: [catalog]
      responses:
        "200":
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
    post:
      operationId: createCategory
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
  /categories/{id}:
    delete:
      operationId: deleteCategory
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
  /brands:
    get:
      operationId: listBrands
      tags: [catalog]
      responses:
        "200":
          description: Brands
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
  /products:
    get:
      operationId: listProducts
      tags: [catalog]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: categoryId
          in: query
          schema: { type: integer }
        - name: brandId
          in: query
          schema: { type: integer }
        - name: color
          in: query
          schema: { type: string }
        - name: size
          in: query
          schema: { type: string }
        - name: occasion
          in: query
          schema: { type: string }
        - name: fabric
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        "200":
          description: Product page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
    post:
      operationId: createProduct
      tags: [catalog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /products/{id}:
    get:
      operationId: getProduct
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    delete:
      operationId: deleteProduct
      tags: [catalog]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ---------------- REVIEWS ----------------
  /products/{id}/reviews:
    get:
      operationId: listProductReviews
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createProductReview
      tags: [reviews]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  # ---------------- WISHLIST ----------------
  /wishlist:
    get:
      operationId: listWishlist
      tags: [wishlist]
      responses:
        "200":
          description: Wishlist items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WishlistItem"
    post:
      operationId: addToWishlist
      tags: [wishlist]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WishlistInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WishlistItem"
  /wishlist/{productId}:
    delete:
      operationId: removeFromWishlist
      tags: [wishlist]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  # ---------------- HOME VISIT CART ----------------
  /home-visit-cart:
    get:
      operationId: listHomeVisitCart
      tags: [cart]
      responses:
        "200":
          description: Home visit cart items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CartItem"
    post:
      operationId: addToHomeVisitCart
      tags: [cart]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CartItemInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
    delete:
      operationId: clearHomeVisitCart
      tags: [cart]
      responses:
        "204":
          description: Cleared
  /home-visit-cart/{productId}:
    delete:
      operationId: removeFromHomeVisitCart
      tags: [cart]
      parameters:
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "204":
          description: Removed

  # ---------------- BOOKINGS ----------------
  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: Admin - list all bookings, optionally filtered by status
      parameters:
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a home visit booking from the current home visit cart
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/me:
    get:
      operationId: listMyBookings
      tags: [bookings]
      responses:
        "200":
          description: My bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Not found
  /bookings/{id}/status:
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Admin - approve, reject, complete, or cancel a booking
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}/reschedule:
    patch:
      operationId: rescheduleBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleInput"
      responses:
        "200":
          description: Rescheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}/assign-executive:
    patch:
      operationId: assignExecutiveToBooking
      tags: [bookings]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignExecutiveInput"
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /bookings/{id}/products:
    post:
      operationId: addBookingProduct
      tags: [bookings]
      summary: Admin/executive - add a recommended product to a booking
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingProductInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProduct"
  /bookings/{id}/products/{productId}/status:
    patch:
      operationId: updateBookingProductStatus
      tags: [bookings]
      summary: Executive - mark an assigned product sold, returned, or damaged
      parameters:
        - $ref: "#/components/parameters/IdParam"
        - name: productId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingProductStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingProduct"

  # ---------------- ORDERS ----------------
  /orders:
    post:
      operationId: createOrder
      tags: [orders]
      summary: Customer - create a direct custom order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
    get:
      operationId: listOrders
      tags: [orders]
      summary: Admin - list all direct orders
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
  /orders/me:
    get:
      operationId: listMyOrders
      tags: [orders]
      responses:
        "200":
          description: My orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"

  # ---------------- EXECUTIVES ----------------
  /executives:
    get:
      operationId: listExecutives
      tags: [executives]
      responses:
        "200":
          description: Executives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Executive"
    post:
      operationId: createExecutive
      tags: [executives]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExecutiveInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Executive"
  /executives/me/visits:
    get:
      operationId: listMyVisits
      tags: [executives]
      summary: Executive - list bookings assigned to me
      parameters:
        - name: date
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Assigned bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  # ---------------- INVOICES ----------------
  /bookings/{id}/invoice:
    get:
      operationId: getBookingInvoice
      tags: [invoices]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Invoice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "404":
          description: Not generated yet
    post:
      operationId: generateBookingInvoice
      tags: [invoices]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceInput"
      responses:
        "201":
          description: Generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"

  # ---------------- ADMIN DASHBOARD ----------------
  /admin/dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [admin]
      responses:
        "200":
          description: Dashboard summary stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /admin/dashboard/analytics:
    get:
      operationId: getDashboardAnalytics
      tags: [admin]
      responses:
        "200":
          description: Analytics breakdowns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardAnalytics"

  # ---------------- NOTIFICATIONS ----------------
  /notifications/me:
    get:
      operationId: listMyNotifications
      tags: [notifications]
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # ---------- AUTH / USERS ----------
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
        role: { type: string, enum: [customer, admin, executive] }
        createdAt: { type: string, format: date-time }
    RegisterInput:
      type: object
      required: [name, email, password, phone]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string }
        password: { type: string, minLength: 6 }
        phone: { type: string, minLength: 1 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string }
        password: { type: string }
    AuthSession:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user:
          $ref: "#/components/schemas/User"

    # ---------- CUSTOMER ----------
    Customer:
      type: object
      required: [id, userId, name, email, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: ["string", "null"] }
        favoriteColors: { type: array, items: { type: string } }
        favoriteBrands: { type: array, items: { type: string } }
        lifetimeSpend: { type: number }
        createdAt: { type: string, format: date-time }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        favoriteColors: { type: array, items: { type: string } }
        favoriteBrands: { type: array, items: { type: string } }
    Address:
      type: object
      required: [id, customerId, label, line1, city, state, pincode, isDefault]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        label: { type: string }
        line1: { type: string }
        line2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        landmark: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        isDefault: { type: boolean }
    AddressInput:
      type: object
      required: [label, line1, city, state, pincode]
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        pincode: { type: string }
        landmark: { type: string }
        lat: { type: number }
        lng: { type: number }
        isDefault: { type: boolean }
    Measurement:
      type: object
      required: [id, customerId]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        gender: { type: ["string", "null"] }
        age: { type: ["integer", "null"] }
        heightCm: { type: ["number", "null"] }
        weightKg: { type: ["number", "null"] }
        topSize: { type: ["string", "null"] }
        bottomSize: { type: ["string", "null"] }
        preferredFit: { type: ["string", "null"] }
    MeasurementInput:
      type: object
      properties:
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        topSize: { type: string }
        bottomSize: { type: string }
        preferredFit: { type: string }

    # ---------- CATALOG ----------
    Category:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: ["string", "null"] }
    Brand:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logoUrl: { type: ["string", "null"] }
    Product:
      type: object
      required:
        [
          id,
          name,
          sku,
          categoryId,
          categoryName,
          brandId,
          brandName,
          color,
          sizes,
          fabric,
          occasion,
          mrp,
          sellingPrice,
          stock,
          images,
          rating,
          createdAt,
        ]
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: ["string", "null"] }
        sku: { type: string }
        barcode: { type: ["string", "null"] }
        qrCode: { type: ["string", "null"] }
        categoryId: { type: integer }
        categoryName: { type: string }
        brandId: { type: integer }
        brandName: { type: string }
        color: { type: string }
        sizes: { type: array, items: { type: string } }
        fabric: { type: string }
        occasion: { type: string }
        mrp: { type: number }
        sellingPrice: { type: number }
        purchaseCost: { type: ["number", "null"] }
        supplier: { type: ["string", "null"] }
        stock: { type: integer }
        warehouse: { type: ["string", "null"] }
        rack: { type: ["string", "null"] }
        images: { type: array, items: { type: string } }
        rating: { type: number }
        createdAt: { type: string, format: date-time }
    ProductInput:
      type: object
      required:
        [
          name,
          sku,
          categoryId,
          brandId,
          color,
          sizes,
          fabric,
          occasion,
          mrp,
          sellingPrice,
          stock,
          images,
        ]
      properties:
        name: { type: string }
        description: { type: string }
        sku: { type: string }
        barcode: { type: string }
        qrCode: { type: string }
        categoryId: { type: integer }
        brandId: { type: integer }
        color: { type: string }
        sizes: { type: array, items: { type: string } }
        fabric: { type: string }
        occasion: { type: string }
        mrp: { type: number }
        sellingPrice: { type: number }
        purchaseCost: { type: number }
        supplier: { type: string }
        stock: { type: integer }
        warehouse: { type: string }
        rack: { type: string }
        images: { type: array, items: { type: string } }
    ProductUpdate:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        categoryId: { type: integer }
        brandId: { type: integer }
        color: { type: string }
        sizes: { type: array, items: { type: string } }
        fabric: { type: string }
        occasion: { type: string }
        mrp: { type: number }
        sellingPrice: { type: number }
        purchaseCost: { type: number }
        supplier: { type: string }
        stock: { type: integer }
        warehouse: { type: string }
        rack: { type: string }
        images: { type: array, items: { type: string } }
    ProductPage:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    Review:
      type: object
      required: [id, productId, customerId, customerName, rating, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        customerId: { type: integer }
        customerName: { type: string }
        rating: { type: integer }
        comment: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    ReviewInput:
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string }

    # ---------- WISHLIST / CART ----------
    WishlistItem:
      type: object
      required: [id, productId, product, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
        createdAt: { type: string, format: date-time }
    WishlistInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
    CartItem:
      type: object
      required: [id, productId, product, quantity, createdAt]
      properties:
        id: { type: integer }
        productId: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
        quantity: { type: integer }
        size: { type: string }
        createdAt: { type: string, format: date-time }
    CartItemInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
        quantity: { type: integer, default: 1 }
        size: { type: string }

    # ---------- BOOKINGS ----------
    BookingProduct:
      type: object
      required: [id, bookingId, productId, product, status]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        productId: { type: integer }
        product:
          $ref: "#/components/schemas/Product"
        status:
          type: string
          enum: [reserved, sold, returned, damaged]
        priceAtSale: { type: ["number", "null"] }
        isRecommended: { type: boolean }
    BookingProductInput:
      type: object
      required: [productId]
      properties:
        productId: { type: integer }
        isRecommended: { type: boolean, default: true }
    BookingProductStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [reserved, sold, returned, damaged]
        priceAtSale: { type: number }
    Booking:
      type: object
      required:
        [
          id,
          bookingCode,
          customerId,
          name,
          phone,
          email,
          addressText,
          gender,
          preferredDate,
          preferredTime,
          status,
          products,
          createdAt,
        ]
      properties:
        id: { type: integer }
        bookingCode: { type: string }
        customerId: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        addressText: { type: string }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
        gender: { type: string }
        age: { type: ["integer", "null"] }
        heightCm: { type: ["number", "null"] }
        weightKg: { type: ["number", "null"] }
        topSize: { type: ["string", "null"] }
        bottomSize: { type: ["string", "null"] }
        preferredFit: { type: ["string", "null"] }
        budget: { type: ["number", "null"] }
        occasion: { type: ["string", "null"] }
        preferredDate: { type: string }
        preferredTime: { type: string }
        preferredColors: { type: array, items: { type: string } }
        preferredBrands: { type: array, items: { type: string } }
        notes: { type: ["string", "null"] }
        status:
          type: string
          enum:
            [
              pending,
              confirmed,
              rescheduled,
              executive_assigned,
              in_progress,
              completed,
              cancelled,
              rejected,
            ]
        executiveId: { type: ["integer", "null"] }
        executiveName: { type: ["string", "null"] }
        products:
          type: array
          items:
            $ref: "#/components/schemas/BookingProduct"
        createdAt: { type: string, format: date-time }
    BookingInput:
      type: object
      required:
        [
          name,
          phone,
          email,
          addressText,
          gender,
          preferredDate,
          preferredTime,
        ]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        addressText: { type: string }
        lat: { type: number }
        lng: { type: number }
        gender: { type: string }
        age: { type: integer }
        heightCm: { type: number }
        weightKg: { type: number }
        topSize: { type: string }
        bottomSize: { type: string }
        preferredFit: { type: string }
        budget: { type: number }
        occasion: { type: string }
        preferredDate: { type: string }
        preferredTime: { type: string }
        preferredColors: { type: array, items: { type: string } }
        preferredBrands: { type: array, items: { type: string } }
        notes: { type: string }
    BookingStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            [
              pending,
              confirmed,
              rescheduled,
              executive_assigned,
              in_progress,
              completed,
              cancelled,
              rejected,
            ]
    RescheduleInput:
      type: object
      required: [preferredDate, preferredTime]
      properties:
        preferredDate: { type: string }
        preferredTime: { type: string }
    AssignExecutiveInput:
      type: object
      required: [executiveId]
      properties:
        executiveId: { type: integer }

    # ---------- EXECUTIVES ----------
    Executive:
      type: object
      required: [id, name, phone, email, activeBookings, rating, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        photoUrl: { type: ["string", "null"] }
        rating: { type: number }
        activeBookings: { type: integer }
        createdAt: { type: string, format: date-time }
    ExecutiveInput:
      type: object
      required: [name, phone, email, password]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        password: { type: string, minLength: 6 }
        photoUrl: { type: string }

    # ---------- INVOICES ----------
    Invoice:
      type: object
      required:
        [
          id,
          bookingId,
          invoiceNumber,
          subtotal,
          tax,
          total,
          paymentMethod,
          paymentStatus,
          createdAt,
        ]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        invoiceNumber: { type: string }
        subtotal: { type: number }
        tax: { type: number }
        total: { type: number }
        paymentMethod:
          type: string
          enum: [cash, upi, card, wallet]
        paymentStatus:
          type: string
          enum: [pending, paid]
        createdAt: { type: string, format: date-time }
    InvoiceInput:
      type: object
      required: [paymentMethod]
      properties:
        paymentMethod:
          type: string
          enum: [cash, upi, card, wallet]

    # ---------- ADMIN DASHBOARD ----------
    DashboardSummary:
      type: object
      required:
        [
          todaysBookings,
          upcomingVisits,
          totalRevenue,
          totalCustomers,
          totalExecutives,
          totalProducts,
          lowStockCount,
          conversionRate,
          averageBill,
        ]
      properties:
        todaysBookings: { type: integer }
        upcomingVisits: { type: integer }
        totalRevenue: { type: number }
        totalCustomers: { type: integer }
        totalExecutives: { type: integer }
        totalProducts: { type: integer }
        lowStockCount: { type: integer }
        conversionRate: { type: number }
        averageBill: { type: number }
    RevenueByDay:
      type: object
      required: [date, revenue, bookings]
      properties:
        date: { type: string }
        revenue: { type: number }
        bookings: { type: integer }
    NamedCount:
      type: object
      required: [name, count]
      properties:
        name: { type: string }
        count: { type: integer }
    DashboardAnalytics:
      type: object
      required:
        [
          revenueByDay,
          mostSelectedProducts,
          mostSoldProducts,
          popularColors,
          popularSizes,
          bookingsByStatus,
        ]
      properties:
        revenueByDay:
          type: array
          items:
            $ref: "#/components/schemas/RevenueByDay"
        mostSelectedProducts:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
        mostSoldProducts:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
        popularColors:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
        popularSizes:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"
        bookingsByStatus:
          type: array
          items:
            $ref: "#/components/schemas/NamedCount"

    # ---------- NOTIFICATIONS ----------
    Notification:
      type: object
      required: [id, title, message, isRead, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        message: { type: string }
        isRead: { type: boolean }
        createdAt: { type: string, format: date-time }
    CategoryInput:
      type: object
      required: [name, slug]
      properties:
        name: { type: string }
        slug: { type: string }
        imageUrl: { type: string }
    Order:
      type: object
      required: [id, orderNumber, customerId, status, totalAmount, shippingAddress, items, createdAt]
      properties:
        id: { type: integer }
        orderNumber: { type: string }
        customerId: { type: integer }
        status: { type: string, enum: [pending, confirmed, processing, shipped, delivered, cancelled] }
        totalAmount: { type: number }
        shippingAddress: { type: string }
        specialRequirements: { type: string }
        createdAt: { type: string, format: date-time }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    OrderItem:
      type: object
      required: [id, orderId, productId, quantity, priceAtSale, color, size]
      properties:
        id: { type: integer }
        orderId: { type: integer }
        productId: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        quantity: { type: integer }
        priceAtSale: { type: number }
        color: { type: string }
        size: { type: string }
    OrderInput:
      type: object
      required: [productId, quantity, color, size, shippingAddress]
      properties:
        productId: { type: integer }
        quantity: { type: integer }
        color: { type: string }
        size: { type: string }
        shippingAddress: { type: string }
        specialRequirements: { type: string }
